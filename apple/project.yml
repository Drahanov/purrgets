# Generate the Xcode project with: cd apple && xcodegen
name: Purrgets

options:
  bundleIdPrefix: com.drahanov
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: P32V7GWGCS
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The Kotlin framework built by Gradle (see the "Build Kotlin" phase).
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../sharedLogic/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: [-framework, SharedLogic]
    # Kotlin builds Apple-silicon frameworks only.
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    "EXCLUDED_ARCHS[sdk=macosx*]": x86_64

targetTemplates:
  Kotlin:
    preBuildScripts:
      - name: Build Kotlin
        basedOnDependencyAnalysis: false
        script: |
          if [ "YES" = "$OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED" ]; then
            echo "Skipping Gradle build"
            exit 0
          fi
          # Xcode doesn't load the shell profile, so find a JDK ourselves.
          if [ -z "$JAVA_HOME" ]; then
            if /usr/libexec/java_home >/dev/null 2>&1; then
              export JAVA_HOME="$(/usr/libexec/java_home)"
            elif [ -d "/Applications/Android Studio.app/Contents/jbr/Contents/Home" ]; then
              export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"
            fi
          fi
          cd "$SRCROOT/.."
          ./gradlew :sharedLogic:embedAndSignAppleFrameworkForXcode

  App:
    type: application
    templates: [Kotlin]
    sources:
      - path: App
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drahanov.purrgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Widget:
    type: app-extension
    templates: [Kotlin]
    sources:
      - path: Widget
        excludes: ["*.plist", "*.entitlements"]
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drahanov.purrgets.widget

targets:
  PurrgetsiOS:
    templates: [App]
    platform: iOS
    entitlements:
      path: App/App-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drahanov.purrgets]
    settings:
      base:
        PURRGETS_APP_GROUP: group.com.drahanov.purrgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Purrgets
        CFBundleURLTypes:
          - CFBundleURLName: com.drahanov.purrgets
            CFBundleURLSchemes: [purrgets]
        PurrgetsAppGroup: $(PURRGETS_APP_GROUP)
        NSCalendarsFullAccessUsageDescription: Purrgets reads your calendar so you can turn an event into a countdown.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
    dependencies:
      - target: PurrgetsWidgetiOS

  PurrgetsWidgetiOS:
    templates: [Widget]
    platform: iOS
    info:
      path: Widget/Info-iOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Purrgets
        PurrgetsAppGroup: $(PURRGETS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget-iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.drahanov.purrgets]
    settings:
      base:
        PURRGETS_APP_GROUP: group.com.drahanov.purrgets
        TARGETED_DEVICE_FAMILY: "1"

  PurrgetsMac:
    templates: [App]
    platform: macOS
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Purrgets
        CFBundleURLTypes:
          - CFBundleURLName: com.drahanov.purrgets
            CFBundleURLSchemes: [purrgets]
        PurrgetsAppGroup: $(PURRGETS_APP_GROUP)
        NSCalendarsFullAccessUsageDescription: Purrgets reads your calendar so you can turn an event into a countdown.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
    entitlements:
      path: App/App-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.drahanov.purrgets]
    settings:
      base:
        PURRGETS_APP_GROUP: $(TeamIdentifierPrefix)com.drahanov.purrgets
        ENABLE_HARDENED_RUNTIME: YES
        # Dock, Finder and the app menu show the product name, not the display name.
        # The module keeps the target name so it doesn't clash with `enum Purrgets`.
        PRODUCT_NAME: Purrgets
        PRODUCT_MODULE_NAME: PurrgetsMac
        # Ink sidebar selection and controls instead of the system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PurrgetsWidgetMac

  PurrgetsWidgetMac:
    templates: [Widget]
    platform: macOS
    info:
      path: Widget/Info-macOS.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Purrgets
        PurrgetsAppGroup: $(PURRGETS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TeamIdentifierPrefix)com.drahanov.purrgets]
    settings:
      base:
        PURRGETS_APP_GROUP: $(TeamIdentifierPrefix)com.drahanov.purrgets
        ENABLE_HARDENED_RUNTIME: YES

  # Renders every widget style and size to PNG and compares with the saved ones.
  PurrgetsSnapshotTests:
    type: bundle.unit-test
    platform: macOS
    templates: [Kotlin]
    sources:
      - Tests
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drahanov.purrgets.snapshot-tests
        GENERATE_INFOPLIST_FILE: YES

  # Editor draft, store and view models, against a Kotlin container on a temp folder.
  PurrgetsAppTests:
    type: bundle.unit-test
    platform: macOS
    templates: [Kotlin]
    sources:
      - AppTests
      - Shared
      - path: App
        excludes: ["*.plist", "*.entitlements", "Assets.xcassets", "PurrgetsApp.swift"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.drahanov.purrgets.app-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PurrgetsiOS:
    build:
      targets:
        PurrgetsiOS: all
  PurrgetsMac:
    build:
      targets:
        PurrgetsMac: all
    test:
      targets: [PurrgetsSnapshotTests, PurrgetsAppTests]
  PurrgetsAppTests:
    build:
      targets:
        PurrgetsAppTests: all
    test:
      targets: [PurrgetsAppTests]
  PurrgetsSnapshotTests:
    build:
      targets:
        PurrgetsSnapshotTests: all
    test:
      targets: [PurrgetsSnapshotTests]
